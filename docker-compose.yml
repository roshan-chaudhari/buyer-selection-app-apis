services:
  buyer-db:
    image: mysql:8.0
    container_name: buyer-db

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_PORT: ${DB_PORT}
      MYSQL_HOST: ${DB_HOST}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}

    command: --default-authentication-plugin=mysql_native_password

    volumes:
      - buyer_mysql_data:/var/lib/mysql

    networks:
      - buyer-network

  buyer-api:
    build: .

    container_name: buyer-api

    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      - buyer-db

    ports:
      - "${PORT}:${PORT}" # 5000:5000

    networks:
      - buyer-network

volumes:
  buyer_mysql_data:

networks:
  buyer-network:
    driver: bridge
